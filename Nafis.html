<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Profile</title>
<style>
  :root {
    --ink: #1c2321;
    --paper: #f2ede4;
    --card: #ffffff;
    --accent: #3b6e5e;
    --accent-soft: #e4efe9;
    --muted: #6b6459;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--card);
    border-radius: 18px;
    padding: 40px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 40px rgba(28, 35, 33, 0.08);
    text-align: center;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 600;
    margin-bottom: 18px;
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .role {
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    margin: 4px 0 16px;
  }

  .bio {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 24px;
  }

  .stats {
    display: flex;
    width: 100%;
    justify-content: space-between;
    border-top: 1px solid #eee;
    padding-top: 20px;
    margin-bottom: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat span:first-child {
    font-size: 18px;
    font-weight: 700;
  }

  .stat span:last-child {
    font-size: 12px;
    color: var(--muted);
  }

  .links {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .links a {
    flex: 1;
    text-decoration: none;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }

  .links a.primary {
    background: var(--accent);
    color: #fff;
  }

  .links a.secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">NRH</div>
    <h1 class="name">Nafis Raihan Hafizh</h1>
    <p class="role">Siswa SMK &bull; Belajar Git</p>
    <p class="bio">
      Sedang belajar version control dan membangun proyek pertama untuk dipush ke GitHub.
    </p>

    <div class="stats">
      <div class="stat">
        <span>12</span>
        <span>Commit</span>
      </div>
      <div class="stat">
        <span>3</span>
        <span>Repository</span>
      </div>
      <div class="stat">
        <span>1</span>
        <span>Kelas</span>
      </div>
    </div>

    <div class="links">
      <a class="primary" href="#">GitHub</a>
      <a class="secondary" href="#">Kontak</a>
    </div>
  </div>

</body>
</html>
